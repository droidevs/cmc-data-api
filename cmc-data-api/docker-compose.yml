version: "3.9"

services:

    app:
        build: .
        container_name: laravel-app

        volumes:
            - .:/var/www

        depends_on:
            - postgres
            - redis

    nginx:
        image: nginx:alpine
        container_name: nginx

        ports:
            - "8000:80"

        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

        depends_on:
            - app

    postgres:
        image: postgres:17

        environment:
            POSTGRES_DB: cmc_data_api
            POSTGRES_USER: cmc_data_api_user
            POSTGRES_PASSWORD: cmc-data-api-secret

        ports:
            - "5432:5432"

    redis:
        image: redis:7-alpine

        ports:
            - "6379:6379"
